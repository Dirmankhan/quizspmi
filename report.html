<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Kuis SPMI, SNP &amp; Rapor Pendidikan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <section id="screen-report" class="screen active">
      <div class="card card-wide">
        <div class="report-header">
          <div>
            <p class="eyebrow">Report Kuis</p>
            <h1>Persentase Jawaban Benar per Topik</h1>
            <p id="report-generated-at" class="lead"></p>
          </div>
          <button id="btn-refresh" class="btn btn-ghost" type="button">Muat Ulang</button>
        </div>

        <div id="report-load-error" class="field-error" hidden></div>
        <div id="report-loading" class="hint">Memuat data report...</div>

        <div class="report-group">
          <h2>Akumulasi (Sebelum Hari Ini)</h2>
          <p id="akumulasi-meta" class="report-meta"></p>
          <div id="akumulasi-stats" class="report-stats"></div>
        </div>

        <div class="report-group">
          <h2>Hari Ini</h2>
          <p id="harini-meta" class="report-meta"></p>
          <div id="harini-stats" class="report-stats"></div>
        </div>

        <p class="hint">Report ini mengagregasi data dari Sheet "Rekap Hasil Kuis SPMI-SNP-Rapor Pendidikan" secara langsung.</p>
      </div>
    </section>

  </div>

  <script src="report.js"></script>
</body>
</html>
